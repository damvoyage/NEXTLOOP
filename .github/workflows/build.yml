name: Build NEXTLOOP

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  engine-tests:
    name: Engine tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ffmpeg python3-numpy libasound2-dev libfreetype-dev \
            libfontconfig1-dev libx11-dev libxext-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLOOPDECK_BUILD_APP=OFF
      - name: Build tests
        run: cmake --build build --target NEXTLOOPTests
      - name: Generate test audio
        run: python3 Tests/make_test_audio.py testaudio
      - name: Run tests
        run: ./build/NEXTLOOPTests_artefacts/Release/NEXTLOOPTests testaudio

  windows:
    name: Windows ${{ matrix.label }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # JUCE 9: Windows 10 (1607+) and 11, GPU-accelerated drawing
          - label: "10-11 (64-bit)"
            juce: "9.0.4"
            arch: x64
            artifact: NEXTLOOP-Windows10-11-x64
          # JUCE 7: runs on Windows 7 SP1, 8, 8.1, 10 and 11
          - label: "7+ (64-bit)"
            juce: "7.0.12"
            arch: x64
            artifact: NEXTLOOP-Windows7-x64
          - label: "7+ (32-bit)"
            juce: "7.0.12"
            arch: Win32
            artifact: NEXTLOOP-Windows7-x86
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.arch }} -DLOOPDECK_BUILD_TESTS=OFF -DLOOPDECK_JUCE_VERSION=${{ matrix.juce }}
      - name: Build
        run: cmake --build build --config Release --parallel --target NEXTLOOP
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/NEXTLOOP_artefacts/Release/NEXTLOOP.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.artifact }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  macos:
    name: macOS (universal .app)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Xcode -DLOOPDECK_BUILD_TESTS=OFF -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
      - name: Build
        run: cmake --build build --config Release --target NEXTLOOP -- -quiet
      - name: Sign (ad hoc) and package
        run: |
          APP=build/NEXTLOOP_artefacts/Release/NEXTLOOP.app
          codesign --force --deep --sign - "$APP"
          lipo -info "$APP/Contents/MacOS/NEXTLOOP"
          ditto -c -k --keepParent "$APP" NEXTLOOP-macOS-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NEXTLOOP-macOS-universal
          path: NEXTLOOP-macOS-universal.zip

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [engine-tests, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
